name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/invoice-app-preview"
          docker build \
            --tag $IMAGE:pr-${{ github.event.pull_request.number }} \
            .

      - run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/invoice-app-preview"
          docker push $IMAGE:pr-${{ github.event.pull_request.number }}

      - run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/invoice-app-preview"
          SERVICE_NAME="invoice-app-pr-${{ github.event.pull_request.number }}"
          
          gcloud run deploy $SERVICE_NAME \
            --image=$IMAGE:pr-${{ github.event.pull_request.number }} \
            --service-account=github-action-sa@invoice-app-496008.iam.gserviceaccount.com \
            --platform=managed \
            --region=${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=1 \
            --add-cloudsql-instances=${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
            --set-env-vars="APP_ENV=staging" \
            --set-env-vars="APP_DEBUG=true" \
            --set-env-vars="APP_KEY=${{ secrets.APP_KEY }}" \
            --set-env-vars="DB_CONNECTION=mysql" \
            --set-env-vars="DB_DATABASE=${{ secrets.DB_DATABASE_STAGING }}" \
            --set-env-vars="DB_USERNAME=${{ secrets.DB_USERNAME }}" \
            --set-env-vars="DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --set-env-vars="DB_SOCKET=/cloudsql/${{ secrets.CLOUD_SQL_CONNECTION_NAME }}" \
            --set-env-vars="LOG_CHANNEL=stderr" \
            --set-env-vars="CACHE_DRIVER=array" \
            --set-env-vars="SESSION_DRIVER=cookie" \
            --set-env-vars="QUEUE_CONNECTION=sync"

      - uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const region = '${{ secrets.GCP_REGION }}';
            const serviceName = 'invoice-app-pr-${{ github.event.pull_request.number }}';
            const url = execSync(`gcloud run services describe ${serviceName} --region=${region} --format='value(status.url)'`).toString().trim();
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview Environment Ready!**\n\nAnda dapat meninjau perubahan dari Pull Request ini melalui tautan berikut:\n👉 ${url}`
            })