name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint:
    name: "S1 · Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-lint-${{ hashFiles('composer.lock') }}
          restore-keys: composer-lint-

      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Run Laravel Pint
        run: ./vendor/bin/pint

  test:
    name: "S2+S3 · Install & Test"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, xml, curl, zip, gd, bcmath
          coverage: none

      - name: Cache Composer vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=:memory:/' .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run Unit Tests
        run: php artisan test --testsuite=Unit

      - name: Run Feature Tests
        run: php artisan test --testsuite=Feature

  deploy-preview:
    name: "S4+S5 · Build & Deploy Preview"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/invoice-app-preview"
          docker build \
            --tag $IMAGE:pr-${{ github.event.pull_request.number }} \
            .

      - name: Push Docker Image
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/invoice-app-preview"
          docker push $IMAGE:pr-${{ github.event.pull_request.number }}

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/invoice-app-preview"
          SERVICE_NAME="invoice-app-pr-${{ github.event.pull_request.number }}"
          
          gcloud run deploy $SERVICE_NAME \
            --image=$IMAGE:pr-${{ github.event.pull_request.number }} \
            --service-account=github-action-sa@invoice-app-496008.iam.gserviceaccount.com \
            --platform=managed \
            --region=${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=1 \
            --add-cloudsql-instances=${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
            --set-env-vars="APP_ENV=staging" \
            --set-env-vars="APP_DEBUG=true" \
            --set-env-vars="APP_KEY=${{ secrets.APP_KEY }}" \
            --set-env-vars="DB_CONNECTION=mysql" \
            --set-env-vars="DB_DATABASE=${{ secrets.DB_DATABASE_STAGING }}" \
            --set-env-vars="DB_USERNAME=${{ secrets.DB_USERNAME }}" \
            --set-env-vars="DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --set-env-vars="DB_SOCKET=/cloudsql/${{ secrets.CLOUD_SQL_CONNECTION_NAME }}" \
            --set-env-vars="LOG_CHANNEL=stderr" \
            --set-env-vars="CACHE_DRIVER=array" \
            --set-env-vars="SESSION_DRIVER=cookie" \
            --set-env-vars="QUEUE_CONNECTION=sync"

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const region = '${{ secrets.GCP_REGION }}';
            const serviceName = 'invoice-app-pr-${{ github.event.pull_request.number }}';
            const url = execSync(`gcloud run services describe ${serviceName} --region=${region} --format='value(status.url)'`).toString().trim();
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview Environment Ready!**\n\nAnda dapat meninjau perubahan dari Pull Request ini melalui tautan berikut:\n👉 ${url}`
            })